services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dclog
      MYSQL_USER: dclog
      MYSQL_PASSWORD: dclog
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dclog_mysql_data:/var/lib/mysql

volumes:
  dclog_mysql_data:
